<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техникум — Главная</title>
    <!-- Подключаем объединенный файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span>🎓</span>
                <h2>Техникум</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link active">Главная (Календарь)</a>
                <a href="diary.html" class="nav-link">Дневник и Оценки</a>
                <a href="tasks.html" class="nav-link">Задания и Будильник</a>
                <a href="settings.html" class="nav-link">Настройки</a>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Блок "Сегодня" -->
            <div class="today-card">
                <div class="today-icon">🎓</div>
                <div class="today-info">
                    <h3>Сегодня</h3>
                    <p id="todaySchedule">Загрузка расписания...</p>
                </div>
            </div>

            <!-- Блок Календаря и Закладок -->
            <div class="calendar-section">
                <h2>Календарь и Закладки</h2>
                
                <!-- Навигация по месяцам -->
                <div class="calendar-nav">
                    <button id="prevMonth" class="btn-month">← Месяц</button>
                    <span id="monthYearTitle" class="month-title"></span>
                    <button id="nextMonth" class="btn-month">Месяц →</button>
                </div>

                <!-- Дни недели -->
                <div class="weekdays-grid">
                    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
                </div>

                <!-- Сетка для дней календаря -->
                <div class="calendar-grid" id="calendarGrid"></div>

                <!-- Быстрые закладки -->
                <div class="bookmarks-section">
                    <h3>📌 Быстрые закладки на день</h3>
                    <div class="bookmark-input-group">
                        <input type="text" id="bookmarkInput" placeholder="Название закладки или ссылка...">
                        <button id="addBookmarkBtn" class="btn-add">Добавить</button>
                    </div>
                    <div id="bookmarksList" class="bookmarks-list"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Подключаем основной скрипт -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
